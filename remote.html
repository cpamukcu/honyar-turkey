<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/cpamukcu/honyar-turkey@f16bffa14c37d9d411e0d90b67221f9c38946c21/img/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Honyar Remote</title>
<style>
:root{--bg:#000;--card:#1C1C1E;--fg:#F5F5F7;--white:#fff;--muted:#86868B;--blue:#0A84FF;--amber:#FF9F0A;--green:#30D158;--red:#FF453A;--line:rgba(255,255,255,.12);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--nf:21px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px 0;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:14px;color:var(--muted)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
#dot.ok{background:var(--green)}#dot.wait{background:var(--amber)}#dot.off{background:var(--red)}
#stat{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--white);padding:6px 12px;border-radius:999px;background:var(--card)}
#timer.run{color:var(--green)}
#reset{font-size:13px;color:var(--muted);padding:6px 4px}
#now{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{margin:6px 0 4px;font-size:26px;line-height:1.15;font-weight:700;color:var(--white);text-wrap:balance}
#nxt{margin:0;font-size:15px;color:var(--muted)}
#notes{white-space:pre-line;flex:1;min-height:0;overflow-y:auto;padding:16px 2px 24px;font-size:var(--nf);line-height:1.5;color:var(--fg);-webkit-overflow-scrolling:touch}
#tools{display:flex;gap:8px;padding:8px 0}
#tools button{flex:1;padding:10px 0;border-radius:12px;background:var(--card);font-size:15px;font-weight:600}
footer{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px))}
footer button{height:96px;border-radius:22px;font-size:22px;font-weight:700;background:var(--card);color:var(--white);touch-action:manipulation}
footer #nextBtn{background:var(--blue)}
footer button:active{transform:scale(.97);opacity:.85}
#list,#join{position:fixed;inset:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#list[hidden],#join[hidden]{display:none}
#list h2,#join h2{margin:0 0 12px;font-size:22px;color:var(--white)}
#list ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#list li button{width:100%;text-align:left;display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);font-size:16px}
#list li button span{color:var(--muted);font-variant-numeric:tabular-nums;width:24px;flex:none}
#list li button.cur{outline:2px solid var(--blue)}
#closeList{float:right;font-size:16px;color:var(--blue);padding:4px}
#join p{color:var(--muted);font-size:16px;line-height:1.4}
#join input{width:100%;font:700 28px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--white)}
#join button{width:100%;margin-top:12px;padding:16px;border-radius:16px;background:var(--blue);font-size:18px;font-weight:700;color:var(--white)}
#notes .nl-open{font-weight:700;color:var(--white);margin:0 0 14px}#notes .nl-pt{position:relative;padding-left:22px;margin:0 0 10px}#notes .nl-pt:before{content:'';position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--blue)}#notes .nl-cue{color:var(--amber);font-style:italic;font-size:.85em;margin:4px 0 12px}#notes .nl{margin:0 0 10px}
</style>
</head>
<body>
<header><i id="dot"></i><span id="stat">Connecting&#8230;</span><button id="reset">Reset</button><button id="timer" aria-label="Start or pause the timer">00:00</button></header>
<section id="now"><p class="kick">Slide <span id="num">1</span> / <span id="tot">1</span></p><h1 id="title"></h1><p id="nxt"></p></section>
<article id="notes" aria-live="polite"></article>
<div id="tools"><button id="aminus" aria-label="Smaller text">A&#8722;</button><button id="aplus" aria-label="Bigger text">A+</button><button id="listBtn">All slides</button></div>
<footer><button id="prevBtn">&#8249; Back</button><button id="nextBtn">Next &#8250;</button></footer>
<div id="list" hidden><button id="closeList">Close</button><h2>Go to slide</h2><ol id="ol"></ol></div>
<div id="join" hidden><h2>Connect to the slides</h2><p>On the laptop, press <b>P</b> or click <b>Phone</b> to see the code. Then type it here.</p><form id="jf"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE"><button type="submit">Connect</button></form></div>
<script>const TITLES=["Building Safer Homes, Together", "Today", "04:17", "We remember", "Turkey took it seriously", "Istanbul is next", "Families are changing", "The wall switch is a hard market", "Honyar's door: earthquake safety", "What makes Honyar special in Turkey", "Three needs, three kits", "Chinese brands are already winning in Turkey", "How Honyar enters Turkey", "Let's build them safer, together"];const NOTES=["\"Hello everyone, I'm Can. I'm doing a solo presentation today.\"\n\u2022 And my project is Honyar in Turkey.", "\"I'll go in four steps.\"\n\u2022 First, the earthquake and the rebuild.\n\u2022 Second, how Turkish families are changing.\n\u2022 Third, why switches won't work, and what will.\n\u2022 And lastly, Honyar's marketing plan in Turkey.", "\"6 February 2023. 4:17 in the morning.\"\n\u2022 A huge earthquake hit Turkey.\n\u2022 And Turkey stood up and started to rebuild.", "(Let the video play. Wait for the number.)\n\u2022 More than 53 thousand people lost their lives, in a single day.\n\u2022 Eleven provinces were hit, where about 14 million people lived.\n\u2022 And around 280 thousand buildings were destroyed or badly damaged.\n\u2022 (Optional) Personally, some of my relatives were affected too.", "\"After this earthquake, everything changed in Turkey.\"\n\u2022 Turkey took it very seriously.\n\u2022 Around half a million new homes were built by December 2025, in about three years.\n\u2022 In Istanbul, almost a million homes were renewed in 13 years.\n\u2022 And the government brought in new rules to rebuild faster and safer.\n\u2022 So now, safety is part of every new home in Turkey.\n\u2022 And that means millions of new breakers, cables, lights and pipes.", "\"Unfortunately, Istanbul is next.\"\n\u2022 Scientists say there's a 47 percent chance of a 7-plus earthquake near Istanbul in the next 30 years.\n(Point at the map.)\n\u2022 You can see this orange line here. That's the North Anatolian Fault.\n\u2022 And right under Istanbul, there hasn't been a big earthquake since 1766.\n\u2022 In April 2025, we had a 6.2 near Istanbul. That was a serious warning.\n\u2022 And around 1.5 million older homes are still waiting to be renewed.", "\"Families in Turkey are changing too.\"\n\u2022 Today, there are about three people per home.\n\u2022 One in five homes has just one person living in it.\n\u2022 And around 10 million people are over 65.\n\u2022 So homes are getting smaller, and people are getting older.\n\u2022 That's why homes need to be simple, safe and smart.\n\u2022 For example, you get an alert on your phone if something's wrong at your grandmother's home.", "\"As we all know, Honyar is famous in China for switches and sockets.\"\n\u2022 But in Turkey, that's a really hard market to get into.\n\u2022 Three big brands already make them in Turkey.\n\u2022 Schneider Electric and Legrand (luh-GRAHN) are from France. They have their own factories here, and they sell in Turkey and to Europe.\n\u2022 Viko is a Turkish brand, owned by Panasonic from Japan, and it has a factory too.\n\u2022 On top of that, Chinese cables and breakers pay 10 to 15 percent extra customs duty.\n\u2022 So, honestly, Honyar needs a different way in.", "\"So what is Honyar's door? Earthquake safety.\"\n\u2022 More than half of the fires after big earthquakes are electrical.\n\u2022 Honyar already makes fire-resistant cables, smoke sensors with sirens, and phone alerts.\n\u2022 And I have two new ideas. First, a seismic breaker. It cuts the power when strong shaking starts.\n\u2022 Second, a vibration light. When the earthquake starts, the light turns on, so you can get out easily.\n\u2022 So we don't need another switch brand. We need an earthquake-safe home brand.", "\"So what makes Honyar special in Turkey?\"\n\u2022 It's one brand for the whole home: power, light, water and smart home.\n\u2022 It has an earthquake-safe kit: breakers, cable, lights and sensors, all in one package.\n\u2022 It's smart home ready, and it works with Xiaomi, which a lot of people in Turkey already use.\n\u2022 It's ready for Turkish rules, because Turkey follows the European product rules.\n\u2022 It has 40 years of quality behind it.\n\u2022 And it's a stable partner, as part of the CETC group, which is owned by the state.\n\u2022 So: one brand, one kit, one safe home.", "\"So, three needs, and three kits.\"\n\u2022 A is safe wiring: safety breakers, fire-resistant cable, pipes and sensors.\n\u2022 B is water-safe kitchens and bathrooms: splash-proof sockets, safety breakers and a damp sensor.\n\u2022 And C, the most important one: being ready for the next earthquake, with the seismic breaker and the vibration light.", "\"And Chinese brands are already winning in Turkey.\"\n\u2022 Xiaomi makes 5 million phones a year in Istanbul.\n\u2022 Haier invested 85 million euros in two factories in Eski\u015fehir. It's their biggest production base in Europe.\n\u2022 BYD signed a 1 billion dollar factory deal in Manisa in 2024, although it's on hold for now.\n\u2022 TCL makes phones with Ar\u00e7elik, a Turkish company, and Oppo and Vivo make phones here too.\n\u2022 So the pattern is simple: make it in Turkey with a local partner, then sell in Turkey and to Europe.\n\u2022 And Honyar can follow the same path.", "\"So how does Honyar get into the market? In two steps.\"\n\u2022 Step one: sell earthquake-safe kits with public builders.\n\u2022 TOK\u0130 is owned by the Turkish government, and it builds huge housing projects every year.\n\u2022 They're the ones who choose the brands: the switches, the sockets, everything.\n\u2022 Step two: make it in Turkey with a Turkish partner. Then there's no extra import duty.\n\u2022 And Turkey is a great base to sell to Europe.\n\u2022 Just like Xiaomi and Haier did: sell first, then build.", "\"So, let's build them safer, together.\"\n\u2022 Thank you so much!\n\u2022 I'm happy to take your questions."];</script>
<script src="https://cdn.jsdelivr.net/gh/cpamukcu/honyar-turkey@f16bffa14c37d9d411e0d90b67221f9c38946c21/vendor/mqtt.min.js"></script>
<script>
(function(){
  var N=TITLES.length, cur=0, lastState=0, links=[], room=(location.hash||'').replace('#','').toUpperCase();
  var $=function(id){return document.getElementById(id);};
  var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  var nf=21; try{nf=parseInt(localStorage.getItem('honyarNf'),10)||21;}catch(e){}
  function setNf(v){nf=Math.max(15,Math.min(34,v));document.documentElement.style.setProperty('--nf',nf+'px');try{localStorage.setItem('honyarNf',nf);}catch(e){}}
  setNf(nf);
  $('tot').textContent=N;

  function render(){
    $('num').textContent=cur+1;
    $('title').textContent=TITLES[cur];
    $('nxt').textContent=cur<N-1?'Next: '+TITLES[cur+1]:'Last slide';
    var nb=$('notes'); nb.textContent='';(NOTES[cur]||'').split('\n').forEach(function(l){var p=document.createElement('p');var t=l.trim(); p.className=t.charAt(0)==='"'?'nl-open':t.charAt(0)==='('?'nl-cue':t.charAt(0)==='\u2022'?'nl-pt':'nl';p.textContent=t.charAt(0)==='\u2022'?t.slice(1).trim():t; nb.appendChild(p);});
    $('notes').scrollTop=0;
    var bs=$('ol').querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('cur',i===cur);
  }
  TITLES.forEach(function(t,i){var li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span>'+(i+1)+'</span>';b.appendChild(document.createTextNode(t));b.onclick=function(){go(i);$('list').hidden=true;};li.appendChild(b);$('ol').appendChild(li);});
  render();

  function setStatus(){
    var up=links.filter(function(c){return c.connected;}).length, live=Date.now()-lastState<40000;
    $('dot').className=live?'ok':up?'wait':'off';
    $('stat').textContent=!room?'Not connected':live?'Connected to the slides':up?'Waiting for the laptop ('+room+')':'Offline: notes only';
  }
  function send(a,n){
    var msg=JSON.stringify({a:a,n:n,id:Math.random().toString(36).slice(2)+Date.now()});
    links.forEach(function(c){if(c.connected)c.publish('honyar-deck/v1/'+room+'/cmd',msg);});
  }
  function buzz(){try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}}
  function go(i){i=Math.max(0,Math.min(N-1,i));cur=i;render();send('go',i);buzz();startTimer();}
  $('nextBtn').onclick=function(){if(cur<N-1){cur++;render();} send('next');buzz();startTimer();};
  $('prevBtn').onclick=function(){if(cur>0){cur--;render();} send('prev');buzz();};
  $('aplus').onclick=function(){setNf(nf+2);};
  $('aminus').onclick=function(){setNf(nf-2);};
  $('listBtn').onclick=function(){$('list').hidden=false;var c=$('ol').querySelector('.cur');if(c)c.scrollIntoView({block:'center'});};
  $('closeList').onclick=function(){$('list').hidden=true;};

  // Timer: tap to start or pause; it also starts on the first Next.
  var t0=0, acc=0, running=false;
  function startTimer(){if(!running){running=true;t0=Date.now();$('timer').classList.add('run');}}
  $('timer').onclick=function(){if(running){acc+=Date.now()-t0;running=false;$('timer').classList.remove('run');}else startTimer();};
  $('reset').onclick=function(){acc=0;t0=Date.now();running=false;$('timer').classList.remove('run');tick();};
  function tick(){var s=Math.floor((acc+(running?Date.now()-t0:0))/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  setInterval(tick,500);

  // Keep the phone screen on while presenting.
  var lock=null;
  function wakeLock(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){});}catch(e){}}
  document.addEventListener('click',wakeLock);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wakeLock();});

  function connect(){
    if(!window.mqtt){setStatus();return;}
    BROKERS.forEach(function(url){
      try{
        var c=mqtt.connect(url,{clientId:'phone_'+Math.random().toString(16).slice(2,10),reconnectPeriod:3000,connectTimeout:8000,keepalive:30});
        c.on('connect',function(){c.subscribe('honyar-deck/v1/'+room+'/state');send('hello');setStatus();});
        c.on('close',setStatus);c.on('error',function(){});
        c.on('message',function(t,p){try{var m=JSON.parse(p.toString());if(typeof m.n==='number'&&m.t>=lastState){lastState=m.t;if(Date.now()-m.t<40000&&m.n!==cur){cur=m.n;render();}}}catch(e){}setStatus();});
        links.push(c);
      }catch(e){}
    });
    setInterval(function(){send('ping');setStatus();},15000);
  }
  if(/^[A-Z0-9]{6}$/.test(room)) connect(); else $('join').hidden=false;
  $('jf').onsubmit=function(e){e.preventDefault();var v=$('code').value.trim().toUpperCase();if(/^[A-Z0-9]{6}$/.test(v)){room=v;history.replaceState(null,'','#'+v);$('join').hidden=true;connect();}};
  setStatus();
})();
</script>
</body>
</html>
