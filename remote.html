<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Honyar Remote</title>
<style>
:root{--bg:#000;--card:#1C1C1E;--fg:#F5F5F7;--white:#fff;--muted:#86868B;--blue:#0A84FF;--amber:#FF9F0A;--green:#30D158;--red:#FF453A;--line:rgba(255,255,255,.12);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--nf:21px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px 0;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:14px;color:var(--muted)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
#dot.ok{background:var(--green)}#dot.wait{background:var(--amber)}#dot.off{background:var(--red)}
#stat{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--white);padding:6px 12px;border-radius:999px;background:var(--card)}
#timer.run{color:var(--green)}
#reset{font-size:13px;color:var(--muted);padding:6px 4px}
#now{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{margin:6px 0 4px;font-size:26px;line-height:1.15;font-weight:700;color:var(--white);text-wrap:balance}
#nxt{margin:0;font-size:15px;color:var(--muted)}
#notes{white-space:pre-line;flex:1;min-height:0;overflow-y:auto;padding:16px 2px 24px;font-size:var(--nf);line-height:1.5;color:var(--fg);-webkit-overflow-scrolling:touch}
#tools{display:flex;gap:8px;padding:8px 0}
#tools button{flex:1;padding:10px 0;border-radius:12px;background:var(--card);font-size:15px;font-weight:600}
footer{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px))}
footer button{height:96px;border-radius:22px;font-size:22px;font-weight:700;background:var(--card);color:var(--white);touch-action:manipulation}
footer #nextBtn{background:var(--blue)}
footer button:active{transform:scale(.97);opacity:.85}
#list,#join{position:fixed;inset:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#list[hidden],#join[hidden]{display:none}
#list h2,#join h2{margin:0 0 12px;font-size:22px;color:var(--white)}
#list ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#list li button{width:100%;text-align:left;display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);font-size:16px}
#list li button span{color:var(--muted);font-variant-numeric:tabular-nums;width:24px;flex:none}
#list li button.cur{outline:2px solid var(--blue)}
#closeList{float:right;font-size:16px;color:var(--blue);padding:4px}
#join p{color:var(--muted);font-size:16px;line-height:1.4}
#join input{width:100%;font:700 28px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--white)}
#join button{width:100%;margin-top:12px;padding:16px;border-radius:16px;background:var(--blue);font-size:18px;font-weight:700;color:var(--white)}
</style>
</head>
<body>
<header><i id="dot"></i><span id="stat">Connecting&#8230;</span><button id="reset">Reset</button><button id="timer" aria-label="Start or pause the timer">00:00</button></header>
<section id="now"><p class="kick">Slide <span id="num">1</span> / <span id="tot">1</span></p><h1 id="title"></h1><p id="nxt"></p></section>
<article id="notes" aria-live="polite"></article>
<div id="tools"><button id="aminus" aria-label="Smaller text">A&#8722;</button><button id="aplus" aria-label="Bigger text">A+</button><button id="listBtn">All slides</button></div>
<footer><button id="prevBtn">&#8249; Back</button><button id="nextBtn">Next &#8250;</button></footer>
<div id="list" hidden><button id="closeList">Close</button><h2>Go to slide</h2><ol id="ol"></ol></div>
<div id="join" hidden><h2>Connect to the slides</h2><p>On the laptop, press <b>P</b> or click <b>Phone</b> to see the code. Then type it here.</p><form id="jf"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE"><button type="submit">Connect</button></form></div>
<script>const TITLES=["Building Safer Homes, Together", "Today", "04:17", "We remember", "Turkey took it seriously", "Istanbul is next", "Families are changing", "Who chooses the brand of switches, cables and pipes?", "The wall switch is a hard market", "Honyar's door: earthquake safety", "What makes Honyar special in Turkey", "Three clear needs in Turkish homes", "Need A: Safe wiring for renewed flats", "Need B: Water-safe kitchens and bathrooms", "Need C: Ready for the next earthquake", "One kit for each need", "Chinese brands are already winning in Turkey", "Grow with Turkey's public builders", "What this means for Honyar", "Where Honyar stands", "How I will build the final plan", "Let's build them safer, together"];const NOTES=["Hi everyone, I'm Can. I'm doing this one solo.\nMy project is about Honyar in Turkey.\nLook at this building. At first, only one window is on.\nNow more and more lights come on.\nEvery light is a new home. And that's my story today.", "I'll go in four steps.\nFirst, the earthquake, and the rebuild after it.\nThen, who really chooses the brand of switches, cables and pipes in a new Turkish home.\nThird, why switches won't work for Honyar, and what will.\nAnd last, Honyar's marketing plan in Turkey.", "February 6th, 2023. 4:17 in the morning.\nMost people were asleep.\nA huge earthquake hit Kahramanmara\u015f, in the south of Turkey.\nIt was winter, it was dark, and the power went out.", "(Let the video play. The number comes in as the city goes dark.)\nMore than 53 thousand people lost their lives.\nEleven provinces were hit, where about 14 million people lived.\nAround 280 thousand buildings were destroyed or badly damaged.\nPersonally, some of my relatives were also affected by this earthquake.\n(Short pause.)", "After the earthquake, everything changed in Turkey.\nIn less than three years, the government built around half a million new homes in the region.\nIn Istanbul, almost a million homes were renewed in thirteen years.\nA new law also made rebuilding faster.\nSo here's the point for Honyar:\nevery new home needs safe power, light and water.", "Unfortunately, Istanbul is next.\nScientists say there's a 47 percent chance of a big earthquake near Istanbul in the next 30 years.\n(Point at the map.) This orange line is the fault.\nThe red part, right under Istanbul, hasn't moved since 1766.\nIn April 2025 we had a 6.2. That was a serious warning.\nAnd about one and a half million older homes still need to be rebuilt.", "Families in Turkey are changing too.\nHomes are smaller now, about three people each.\nOne in five homes has just one person.\nAnd almost ten million people are over 65.\nSo people want homes that are simple, safe, and a bit smart.\nLike, you get an alert on your phone if something's wrong at your grandma's home.", "So, who actually picks the brand?\nMost of the time, it's not the family.\nIn a new home, the builder chooses. Usually Viko, Schneider or Legrand (say: luh-GRAHN).\nThen the electrician tells people which brand to use.\nAnd the big brands keep electricians happy with points, like a coffee card.\nThe family only buys small extras online, on Trendyol or Hepsiburada.\nSo my point is simple: win the electrician, and you win the home.", "Honyar is famous in China for switches and sockets.\nBut in Turkey, that's already a very hard market to get into.\nSchneider and Legrand are French. Viko is a Turkish brand, owned by Panasonic from Japan.\nAnd all three make their switches in Turkey.\nOn top of that, Chinese breakers and cables pay 10 to 15 percent extra duty.\nSo honestly, Honyar needs a different way into the Turkish market.", "So here is the door: earthquake safety.\nMore than half of the fires after a big earthquake are electrical.\nHonyar already makes fire-resistant cable, smoke sensors and phone alerts.\nAnd I'm adding two new ideas.\nOne: a seismic breaker. It cuts the power when the shaking starts.\nTwo: a light that turns on by itself, so you can find the door in the dark.\nJapan already does this.", "So, why Honyar? What makes it special in Turkey?\nOne brand for the whole home: power, light, water and smart home.\nOne earthquake kit, in one box.\nIt works with the Xiaomi app people already have on their phones.\nIt follows EU rules, and Turkey uses the same rules.\nForty years of quality.\nAnd it's owned by the state, so it's a stable partner.\nSo Honyar shouldn't be one more switch brand.\nIt should be the earthquake-safe home brand.", "From my research, I see three clear needs.\nA: safe wiring for the rebuilt homes in Istanbul.\nB: kitchens and bathrooms, where water and power meet.\nC: being ready for the next earthquake.\nLet's go one by one.", "A is Istanbul.\nOld buildings are torn down and rebuilt. Right now, more than 260 thousand homes.\nOwners want safe wiring, but the builder picks the brands.\nLawyers even tell owners now: write the brands into your contract.\nSo Honyar can offer one safe wiring pack:\nbreakers, fire-resistant cable, water pipes and a smoke sensor.", "B is Hatay. More than 150 thousand new homes there alone.\nThink about a kitchen or a bathroom.\nThe water is right next to the sockets.\nOne splash, and you can get a shock.\nHonyar already makes splash-proof sockets with a cover,\nand breakers that cut the power in a split second if something goes wrong.", "C is the next earthquake.\nWhen the ground shakes, the power goes out, and fires can start in the dark.\nSo this kit has a seismic breaker, a light that turns on by itself, and a smoke alarm with a siren.\nAnd one more idea: a simple Honyar app.\nThe shaking starts, every phone in the family gets an alert,\nand you tap one button: I'm safe.", "So we take Honyar's four product lines:\nsmart home, electrical, lighting and plumbing.\nAnd we mix them into three kits, one for each need.\nEverything here is Honyar's own, except the dashed one, which comes from a partner.\nThe ones marked \"new\" are my ideas for Turkey.", "And Honyar wouldn't be the first Chinese brand in Turkey.\nXiaomi makes phones in Istanbul, five million a year.\nHaier put 85 million euros into factories in Eski\u015fehir. It's their biggest base in Europe.\nBYD signed a deal for a car factory, but it's on hold for now.\nThe pattern is simple: make it in Turkey with a local partner,\nthen sell to Turkey and to Europe.", "So how does Honyar get in? Through the public builders.\nTOK\u0130 built most of the new homes.\nCities run the renewal projects.\nAnd AFAD runs disaster readiness.\nHonyar is owned by the state, so working with governments is normal for them.\nAnd if they make products in Turkey, they get a better chance in public tenders.\nFirst step: a small pilot in Hatay.", "So, two steps.\nStep one, now: sell earthquake-safe kits through public builders, electricians and online.\nStep two, next: make the products in Turkey, with a Turkish partner.\nJust like Xiaomi and Haier: sell first, then build locally.", "A quick SWOT.\nStrengths: forty years of experience, four product lines, and a strong parent company.\nWeaknesses: nobody in Turkey knows the name yet, and Chinese goods pay extra duty.\nOpportunities: the huge rebuild, and people really want safety now.\nThreats: strong local brands, and electricians who stick with what they know.", "For the final, I'll build the full plan, all from desk research.\nPrice: I'll compare shop prices of about 20 items with Honyar's prices in China, plus shipping and duty.\nMark-up: Viko's price list is public, so I can see how much shops add.\nPayment: trade reports show how shops get paid, often with post-dated cheques.\nAnd for marketing, I'll learn from how Xiaomi, Haier and CHINT came into Turkey.", "Let me end where I started.\nOne window was on. Now look: a family walking into their new home.\nEvery home like this needs light, power and water.\nLet's build them safer, together.\nThank you! I'm happy to take your questions."];</script>
<script src="https://cdn.jsdelivr.net/gh/cpamukcu/honyar-turkey@e1f98cff2327333eb04f069eca9166abf0ba5c1c/vendor/mqtt.min.js"></script>
<script>
(function(){
  var N=TITLES.length, cur=0, lastState=0, links=[], room=(location.hash||'').replace('#','').toUpperCase();
  var $=function(id){return document.getElementById(id);};
  var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  var nf=21; try{nf=parseInt(localStorage.getItem('honyarNf'),10)||21;}catch(e){}
  function setNf(v){nf=Math.max(15,Math.min(34,v));document.documentElement.style.setProperty('--nf',nf+'px');try{localStorage.setItem('honyarNf',nf);}catch(e){}}
  setNf(nf);
  $('tot').textContent=N;

  function render(){
    $('num').textContent=cur+1;
    $('title').textContent=TITLES[cur];
    $('nxt').textContent=cur<N-1?'Next: '+TITLES[cur+1]:'Last slide';
    $('notes').textContent=NOTES[cur]||'';
    $('notes').scrollTop=0;
    var bs=$('ol').querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('cur',i===cur);
  }
  TITLES.forEach(function(t,i){var li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span>'+(i+1)+'</span>';b.appendChild(document.createTextNode(t));b.onclick=function(){go(i);$('list').hidden=true;};li.appendChild(b);$('ol').appendChild(li);});
  render();

  function setStatus(){
    var up=links.filter(function(c){return c.connected;}).length, live=Date.now()-lastState<40000;
    $('dot').className=live?'ok':up?'wait':'off';
    $('stat').textContent=!room?'Not connected':live?'Connected to the slides':up?'Waiting for the laptop ('+room+')':'Offline: notes only';
  }
  function send(a,n){
    var msg=JSON.stringify({a:a,n:n,id:Math.random().toString(36).slice(2)+Date.now()});
    links.forEach(function(c){if(c.connected)c.publish('honyar-deck/v1/'+room+'/cmd',msg);});
  }
  function buzz(){try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}}
  function go(i){i=Math.max(0,Math.min(N-1,i));cur=i;render();send('go',i);buzz();startTimer();}
  $('nextBtn').onclick=function(){if(cur<N-1){cur++;render();} send('next');buzz();startTimer();};
  $('prevBtn').onclick=function(){if(cur>0){cur--;render();} send('prev');buzz();};
  $('aplus').onclick=function(){setNf(nf+2);};
  $('aminus').onclick=function(){setNf(nf-2);};
  $('listBtn').onclick=function(){$('list').hidden=false;var c=$('ol').querySelector('.cur');if(c)c.scrollIntoView({block:'center'});};
  $('closeList').onclick=function(){$('list').hidden=true;};

  // Timer: tap to start or pause; it also starts on the first Next.
  var t0=0, acc=0, running=false;
  function startTimer(){if(!running){running=true;t0=Date.now();$('timer').classList.add('run');}}
  $('timer').onclick=function(){if(running){acc+=Date.now()-t0;running=false;$('timer').classList.remove('run');}else startTimer();};
  $('reset').onclick=function(){acc=0;t0=Date.now();running=false;$('timer').classList.remove('run');tick();};
  function tick(){var s=Math.floor((acc+(running?Date.now()-t0:0))/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  setInterval(tick,500);

  // Keep the phone screen on while presenting.
  var lock=null;
  function wakeLock(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){});}catch(e){}}
  document.addEventListener('click',wakeLock);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wakeLock();});

  function connect(){
    if(!window.mqtt){setStatus();return;}
    BROKERS.forEach(function(url){
      try{
        var c=mqtt.connect(url,{clientId:'phone_'+Math.random().toString(16).slice(2,10),reconnectPeriod:3000,connectTimeout:8000,keepalive:30});
        c.on('connect',function(){c.subscribe('honyar-deck/v1/'+room+'/state');send('hello');setStatus();});
        c.on('close',setStatus);c.on('error',function(){});
        c.on('message',function(t,p){try{var m=JSON.parse(p.toString());if(typeof m.n==='number'&&m.t>=lastState){lastState=m.t;if(Date.now()-m.t<40000&&m.n!==cur){cur=m.n;render();}}}catch(e){}setStatus();});
        links.push(c);
      }catch(e){}
    });
    setInterval(function(){send('ping');setStatus();},15000);
  }
  if(/^[A-Z0-9]{6}$/.test(room)) connect(); else $('join').hidden=false;
  $('jf').onsubmit=function(e){e.preventDefault();var v=$('code').value.trim().toUpperCase();if(/^[A-Z0-9]{6}$/.test(v)){room=v;history.replaceState(null,'','#'+v);$('join').hidden=true;connect();}};
  setStatus();
})();
</script>
</body>
</html>
