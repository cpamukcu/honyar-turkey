<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="img/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Honyar Final Remote</title>
<style>
:root{--bg:#000;--card:#1C1C1E;--fg:#F5F5F7;--white:#fff;--muted:#86868B;--blue:#0A84FF;--amber:#FF9F0A;--green:#30D158;--red:#FF453A;--line:rgba(255,255,255,.12);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--nf:19px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px 0;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:14px;color:var(--muted)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
#dot.ok{background:var(--green)}#dot.wait{background:var(--amber)}#dot.off{background:var(--red)}
#stat{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--white);padding:6px 12px;border-radius:999px;background:var(--card)}
#timer.run{color:var(--green)}
#reset{font-size:13px;color:var(--muted);padding:6px 4px}
#now{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{margin:6px 0 4px;font-size:26px;line-height:1.15;font-weight:700;color:var(--white);text-wrap:balance}
#nxt{margin:0;font-size:15px;color:var(--muted)}
#notes{white-space:pre-line;flex:1;min-height:0;overflow-y:auto;padding:12px 2px 8px;font-size:var(--nf);line-height:1.42;color:var(--fg);-webkit-overflow-scrolling:touch}
#tools{display:none}
#tools button{flex:1;padding:10px 0;border-radius:12px;background:var(--card);font-size:15px;font-weight:600}
footer{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px))}
footer button{height:62px;border-radius:18px;font-size:20px;font-weight:700;background:var(--card);color:var(--white);touch-action:manipulation}
footer #nextBtn{background:var(--blue)}
footer button:active{transform:scale(.97);opacity:.85}
#list,#join{position:fixed;inset:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#list[hidden],#join[hidden]{display:none}
#list h2,#join h2{margin:0 0 12px;font-size:22px;color:var(--white)}
#list ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#list li button{width:100%;text-align:left;display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);font-size:16px}
#list li button span{color:var(--muted);font-variant-numeric:tabular-nums;width:24px;flex:none}
#list li button.cur{outline:2px solid var(--blue)}
#closeList{float:right;font-size:16px;color:var(--blue);padding:4px}
#join p{color:var(--muted);font-size:16px;line-height:1.4}
#join input{width:100%;font:700 28px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--white)}
#join button{width:100%;margin-top:12px;padding:16px;border-radius:16px;background:var(--blue);font-size:18px;font-weight:700;color:var(--white)}
#notes .nl-meta{font-size:.68em;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}#notes .nl-click{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:.7em;color:var(--amber);font-weight:600}#notes .nl-click b{padding:.2em .8em;border-radius:999px;background:var(--amber);color:#000;font-weight:800;letter-spacing:.05em}#notes .nl-pt.over:before{background:var(--amber)}#notes.playing .pre{opacity:.35}footer #nextBtn.busy{opacity:.55}#notes .nl-open{font-weight:700;color:var(--white);margin:0 0 14px}#notes .nl-pt{position:relative;padding-left:22px;margin:0 0 8px}#notes .nl-pt:before{content:'';position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--blue)}#notes .nl-cue{color:var(--amber);font-style:italic;font-size:.85em;margin:4px 0 12px}#notes .nl{margin:0 0 10px}
</style>
</head>
<body>
<header><i id="dot"></i><span id="stat">Connecting&#8230;</span><button id="reset">Reset</button><button id="timer" aria-label="Start or pause the timer">00:00</button></header>
<section id="now"><p class="kick">Slide <span id="num">1</span> / <span id="tot">1</span></p><h1 id="title"></h1><p id="nxt"></p></section>
<article id="notes" aria-live="polite"></article>
<div id="tools"><button id="aminus" aria-label="Smaller text">A&#8722;</button><button id="aplus" aria-label="Bigger text">A+</button><button id="listBtn">All slides</button></div>
<footer><button id="prevBtn">&#8249; Back</button><button id="nextBtn">Next &#8250;</button></footer>
<div id="list" hidden><button id="closeList">Close</button><h2>Go to slide</h2><ol id="ol"></ol></div>
<div id="join" hidden><h2>Connect to the slides</h2><p>On the laptop, press <b>P</b> or click <b>Phone</b> to see the code. Then type it here.</p><form id="jf"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE"><button type="submit">Connect</button></form></div>
<script>const TITLES=["One kit. One safe flat.", "The professor's three comments. My three answers.", "Every line has a leader. The safe flat has none.", "Don't fight the leaders. Start where they aren't.", "Who buys it. Who picks it.", "Pricing", "From factory to home", "One promise: the safe home inside", "One campaign. Four lines.", "Honyar sells a safe flat, not parts.", "Partner first. Then build.", "Risks. And Honyar's answers.", "Let's build them safer, together"];const NOTES=["Slide 1 · 20 s · clock 0:20\n\"Hi everyone, I'm Can.\"\n• Last time, I talked about the problems in Turkish homes.\n• Today, I'll show you the marketing plan: how Honyar can sell all four product lines in Turkey.\n[CLICK · video 6 s]\n• But first: after my mid-term, the professor asked me three questions.", "Slide 2 · 45 s · clock 1:05\n\"Here's what I found.\"\n• First: did the new homes after the quake solve the problem? Only partly. Istanbul is still waiting for its quake, and about 1.5 million old homes are not renewed.\n• Second: do French brands make earthquake-safe home products? No. Schneider and Legrand sell normal breakers and alarms, but they sell nothing for an earthquake inside the flat.\n• Third: do big new buildings need these systems? Yes, but the law already covers the towers. Normal flats get almost nothing. That's the gap.\n[CLICK · video 8 s]\n• So who already sells in this market?\n• Every product line already has a strong leader.", "Slide 3 · 25 s · clock 1:30\n\"In switches, the market is too competitive.\"\n• In breakers, Schneider and ABB are very strong.\n• In lighting, Honyar would be in a price fight with China.\n• In pipes, local brands like Fırat and Kalde lead.\n• So Honyar can't win line by line. But nobody sells one safety kit for one flat. That's Honyar's place.\n[CLICK · video 8 s]\n• So how can Honyar win? I used three ideas from the course.", "Slide 4 · 45 s · clock 2:15\n\"First, niche first mover: Honyar doesn't fight the leaders in switches. It leads the normal flat first.\"\n• Second, good enough for emerging markets: Honyar sells one simple kit, at a price families can pay.\n• Third, disruptive entry, like Nintendo's Wii: Honyar is simpler and cheaper. It starts with normal flats, then moves up to bigger buildings.\n• So Honyar is a follower in switches, but a leader in this niche.\n[CLICK · video 11 s]\n• And inside these new buildings, who actually picks the brand?\n• It's not one person. Four people decide.", "Slide 5 · 20 s · clock 2:35\n\"The developer sets the rules.\"\n• The builder picks the brand, mostly on price.\n• The engineer approves it, and the electrician fits it.\n• So Honyar sells to builders first, then to electricians, then to hotels.\n[CLICK · video 8 s]\n• So what does the builder pay?\n• Honyar should be cheaper than Schneider and safer than Viko.", "Slide 6 · 30 s · clock 3:05\n\"The same breaker costs about 1,060 lira from Viko and about 1,350 from Schneider. My idea for Honyar: about 1,100 lira.\"\n• The full kit is 15% cheaper than buying the parts one by one.\n• Prices in Turkey go up about 30% a year, so Honyar prices in US dollars. Then inflation doesn't affect the price.", "Slide 7 · 30 s · clock 3:35\n\"Do shops pay only after they sell? Shops want to test a new brand first.\"\n• So Honyar gives each new seller 5 to 10 free sample kits to test.\n• How much do they add? Wholesalers add about 20%, and shops add about 30%.\n• There aren't many public numbers, so Honyar should check them with dealers in Istanbul.\n[CLICK · video 8 s]\n• But shops and families must trust a new brand.\n• So the brand has one promise: the safe home inside.", "Slide 8 · 20 s · clock 3:55\n\"Families need trust, so Honyar gives a five-year warranty.\"\n• Distributors need an easy sale, and the free sample kits give them that.\n• Builders need proof, so Honyar runs three test projects.\n• Engineers need papers, so Honyar prepares the CE and TSE files.\n• Honyar's target for the first year is 50 dealers and 5,000 flats.", "Slide 9 · 40 s · clock 4:35\n\"How do people hear about it? Honyar runs one campaign for all four lines, with social media at the center.\"\n• In the first three months, Honyar launches with a stand at Istanbul's big electrical fair.\n• In the next three months, Honyar proves it: electricians share short fire and leak test videos.\n• Then Honyar grows on social media: electricians and families post Instagram and TikTok videos. The kit also goes into two hotels.\n• Every message shows the whole kit, so all four lines grow together.\n[CLICK · video 8 s]\n• So what does Honyar really sell? Not parts. It sells a safe flat.\n• From class, we know a business model has four parts.", "Slide 10 · 20 s · clock 4:55\n\"The value: one price for the whole flat.\"\n• The resources are four product lines, forty years of experience, and Xiaomi's app.\n• The processes are simple: Honyar trains electricians, sells to builders, and builds locally.\n• Honyar earns a price per flat, plus shop sales.\n• Partners fill what Honyar doesn't have. That's open innovation.\n[CLICK · video 8 s]\n• So where is the kit made?\n• And how does Honyar enter Turkey? It partners first, then builds.", "Slide 11 · 30 s · clock 5:25\n\"In year one, Honyar exports and sells with a Turkish partner. Switches pay almost no import tax, so exporting works.\"\n• In year two, Honyar starts a joint venture with a Turkish factory and uses more than half local parts. This gives it an edge in public tenders.\n• In year three, Honyar supplies TOKİ's public homes, and then goes to Europe.\n• It's like Tesla in Shanghai: Tesla built locally and won the government's support.\n[CLICK · video 8 s]\n• But Istanbul is not an easy market.\n• Of course, there are risks.", "Slide 12 · 40 s · clock 6:05\n\"Viko could copy Honyar, so Honyar has to move first.\"\n• Electricians like old brands, so Honyar gives them training and a good reward.\n• Families don't buy safety on their own. Earthquake insurance covers only about half of homes. So Honyar puts safety inside the price of the home.\n[CLICK · video 7 s]\n• Because in the end, it's about one family, in one home.", "Slide 13 · 10 s · clock 6:15\n\"Turkey made the walls strong. Honyar can make the home safe.\"\n• Let's build them safer, together.\n• Thank you. I'm happy to take your questions."];</script>
<script src="vendor/mqtt.min.js"></script><script src="vendor/ntfy-link.js"></script>
<script>
(function(){
  var N=TITLES.length, cur=0, lastState=0, links=[], room=(location.hash||'').replace('#','').toUpperCase();
  var $=function(id){return document.getElementById(id);};
  // broker-cn.emqx.io is inside mainland China (fast without a VPN); the other two are backups.
  var BROKERS=['wss://broker-cn.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
  var lastTap=0;
  var nf=19; /* the A-/A+ buttons are gone, so a size saved before is not used */
  function setNf(v){nf=Math.max(15,Math.min(34,v));document.documentElement.style.setProperty('--nf',nf+'px');try{localStorage.setItem('honyarNf',nf);}catch(e){}}
  setNf(nf);
  $('tot').textContent=N;

  function render(){
    $('num').textContent=cur+1;
    $('title').textContent=TITLES[cur];
    $('nxt').textContent=cur<N-1?'Next: '+TITLES[cur+1]:'Last slide';
    // notes like the AI Bridge remote: a small timing line, the speech as bullets, a CLICK chip,
    // then the lines to keep saying while the video plays (amber dots), which lead into the next slide
    var nb=$('notes'); nb.textContent='';var after=false,first=true;
    (NOTES[cur]||'').split('\n').forEach(function(l){var t=l.trim();if(!t)return;var p=document.createElement('p');
      if(t.charAt(0)==='['){after=true;p.className='nl-click';p.innerHTML='<b>CLICK</b>';p.appendChild(document.createTextNode(t.replace(/^\[CLICK\s*·?\s*|\]$/g,'')+' · keep talking'));}
      else if(t.charAt(0)==='"'){p.className='nl-open'+(after?'':' pre');p.textContent=t.replace(/^"|"$/g,'');}   // the opening line, bold (like the mid-term notes)
      else if(first&&t.charAt(0)!=='\u2022'){p.className='nl-meta';p.textContent=t;}
      else if(t.charAt(0)==='\u2022'){p.className='nl-pt'+(after?' over':' pre');p.textContent=t.slice(1).trim();}
      else{p.className='nl'+(after?'':' pre');p.textContent=t;}
      first=false;nb.appendChild(p);});
    setPlaying(playing);
    $('notes').scrollTop=0;
    var bs=$('ol').querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('cur',i===cur);
  }
  TITLES.forEach(function(t,i){var li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span>'+(i+1)+'</span>';b.appendChild(document.createTextNode(t));b.onclick=function(){go(i);$('list').hidden=true;};li.appendChild(b);$('ol').appendChild(li);});
  render();

  function setStatus(){
    var up=links.filter(function(c){return c.connected;}).length, live=Date.now()-lastState<40000;
    $('dot').className=live?'ok':up?'wait':'off';
    $('stat').textContent=!room?'Not connected':live?'Connected to the slides':up?'Waiting for the laptop ('+room+')':'Offline: notes only';
  }
  function send(a,n){
    var msg=JSON.stringify({a:a,n:n,id:Math.random().toString(36).slice(2)+Date.now()});
    links.forEach(function(c){if(c.connected)c.publish('honyar-final/v1/'+room+'/cmd',msg);});
  }
  function buzz(){try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}}
  // Always send the exact slide number, so fast taps can never skip or double up.
  // A Next that starts a video: stay on this slide (its last lines are said over the video) until the laptop lands on the next one.
  var playing=false,playT=0,deckStarted=null;   // deckStarted false: the laptop shows its Start screen
  function hasClip(i){return /\n\[CLICK/.test(NOTES[i]||'');}
  function clipSec(i){var m=/\[CLICK · video (\d+) s\]/.exec(NOTES[i]||'');return m?+m[1]:8;}
  function setPlaying(on){playing=on;if(on)playT=Date.now();var b=$('nextBtn');if(!b)return;b.textContent=on?'Video playing\u2026':deckStarted===false?'Start \u203A':'Next \u203A';b.classList.toggle('busy',on);$('notes').classList.toggle('playing',on);
    if(on){var c=$('notes').querySelector('.nl-click');if(c)c.scrollIntoView({block:'start',behavior:'smooth'});}}
  // a clip is at most 11 s: after 12 s ask the laptop where it is (a lost message on bad Wi-Fi), after 16 s give up waiting
  setInterval(function(){if(!playing)return;var w=Date.now()-playT;if(w>12000&&w<13100)send('hello');if(w>16000)setPlaying(false);},1000);
  function go(i){i=Math.max(0,Math.min(N-1,i));cur=i;lastTap=Date.now();render();send('go',i);buzz();startTimer();}
  $('nextBtn').onclick=function(){
    // during a video a tap does nothing (no accidental cut while you talk over it); in its last 1.5 s a tap is a plain Next:
    // the slide comes at once, or, if the laptop already landed and its message is still on the way, the talk moves on normally
    if(playing){if(Date.now()-playT>(clipSec(cur)-1.5)*1000){send('next');buzz();}else buzz();return;}
    var live=Date.now()-lastState<40000;
    if(live&&deckStarted===false){send('start');buzz();return;}   // Start: the talk and the timer begin
    if(live&&cur<N-1&&hasClip(cur)){send('go',cur+1);buzz();startTimer();setPlaying(true);return;}
    go(cur+1);};
  $('prevBtn').onclick=function(){if(playing){setPlaying(false);go(cur);return;}cur>0?go(cur-1):buzz();};   // Back during a video: stop it, stay here
  $('aplus').onclick=function(){setNf(nf+2);};
  $('aminus').onclick=function(){setNf(nf-2);};
  $('listBtn').onclick=function(){$('list').hidden=false;var c=$('ol').querySelector('.cur');if(c)c.scrollIntoView({block:'center'});};
  $('closeList').onclick=function(){$('list').hidden=true;};

  // Timer: tap to start or pause; it also starts on the first Next.
  var t0=0, acc=0, running=false;
  function startTimer(){if(!running){running=true;t0=Date.now();$('timer').classList.add('run');}}
  $('timer').onclick=function(){if(running){acc+=Date.now()-t0;running=false;$('timer').classList.remove('run');}else startTimer();};
  $('reset').onclick=function(){acc=0;t0=Date.now();running=false;$('timer').classList.remove('run');tick();};
  function tick(){var s=Math.floor((acc+(running?Date.now()-t0:0))/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  setInterval(tick,500);

  // Keep the phone screen on while presenting.
  var lock=null;
  function wakeLock(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){});}catch(e){}}
  document.addEventListener('click',wakeLock);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wakeLock();});

  function connect(){
    if(!window.mqtt){setStatus();return;}
    function wire(c){
        c.on('connect',function(){c.subscribe('honyar-final/v1/'+room+'/state');send('hello');setStatus();});
        c.on('close',setStatus);c.on('error',function(){});
        c.on('message',function(t,p){try{var m=JSON.parse(p.toString());if(typeof m.n==='number'&&m.t>=lastState){lastState=m.t;if(typeof m.started==='boolean'&&m.started!==deckStarted){var was=deckStarted;deckStarted=m.started;if(was===false&&m.started){acc=0;t0=Date.now();running=true;$('timer').classList.add('run');tick();}setPlaying(playing);}if(Date.now()-m.t<40000){if(m.n!==cur&&Date.now()-lastTap>3000){cur=m.n;playing=false;render();}else if(m.n===cur&&typeof m.tv==='boolean'&&m.tv!==playing&&(m.tv||Date.now()-playT>1500))setPlaying(m.tv);}}}catch(e){}setStatus();});
        links.push(c);
    }
    BROKERS.forEach(function(url){
      try{
        wire(mqtt.connect(url,{clientId:'phone_'+Math.random().toString(16).slice(2,10),reconnectPeriod:3000,connectTimeout:8000,keepalive:30}));
      }catch(e){}
    });
    // Fourth route on the normal HTTPS port, for networks that block the MQTT ports.
    if(window.ntfyConnect&&!window.HONYAR_LOCAL){try{wire(ntfyConnect());}catch(e){}}
    setInterval(function(){send('ping');setStatus();},15000);
  }
  if(/^[A-Z0-9]{6}$/.test(room)) connect(); else $('join').hidden=false;
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  $('jf').onsubmit=function(e){e.preventDefault();var v=$('code').value.trim().toUpperCase();if(/^[A-Z0-9]{6}$/.test(v)){room=v;history.replaceState(null,'','#'+v);$('join').hidden=true;connect();}};
  setStatus();
})();
</script>
</body>
</html>
