<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="img/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Honyar Final Remote</title>
<style>
:root{--bg:#000;--card:#1C1C1E;--fg:#F5F5F7;--white:#fff;--muted:#86868B;--blue:#0A84FF;--amber:#FF9F0A;--green:#30D158;--red:#FF453A;--line:rgba(255,255,255,.12);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--nf:21px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px 0;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:14px;color:var(--muted)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
#dot.ok{background:var(--green)}#dot.wait{background:var(--amber)}#dot.off{background:var(--red)}
#stat{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--white);padding:6px 12px;border-radius:999px;background:var(--card)}
#timer.run{color:var(--green)}
#reset{font-size:13px;color:var(--muted);padding:6px 4px}
#now{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{margin:6px 0 4px;font-size:26px;line-height:1.15;font-weight:700;color:var(--white);text-wrap:balance}
#nxt{margin:0;font-size:15px;color:var(--muted)}
#notes{white-space:pre-line;flex:1;min-height:0;overflow-y:auto;padding:16px 2px 24px;font-size:var(--nf);line-height:1.5;color:var(--fg);-webkit-overflow-scrolling:touch}
#tools{display:flex;gap:8px;padding:8px 0}
#tools button{flex:1;padding:10px 0;border-radius:12px;background:var(--card);font-size:15px;font-weight:600}
footer{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px))}
footer button{height:96px;border-radius:22px;font-size:22px;font-weight:700;background:var(--card);color:var(--white);touch-action:manipulation}
footer #nextBtn{background:var(--blue)}
footer button:active{transform:scale(.97);opacity:.85}
#list,#join{position:fixed;inset:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#list[hidden],#join[hidden]{display:none}
#list h2,#join h2{margin:0 0 12px;font-size:22px;color:var(--white)}
#list ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#list li button{width:100%;text-align:left;display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);font-size:16px}
#list li button span{color:var(--muted);font-variant-numeric:tabular-nums;width:24px;flex:none}
#list li button.cur{outline:2px solid var(--blue)}
#closeList{float:right;font-size:16px;color:var(--blue);padding:4px}
#join p{color:var(--muted);font-size:16px;line-height:1.4}
#join input{width:100%;font:700 28px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--white)}
#join button{width:100%;margin-top:12px;padding:16px;border-radius:16px;background:var(--blue);font-size:18px;font-weight:700;color:var(--white)}
#notes .nl-open{font-weight:700;color:var(--white);margin:0 0 14px}#notes .nl-pt{position:relative;padding-left:22px;margin:0 0 10px}#notes .nl-pt:before{content:'';position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--blue)}#notes .nl-cue{color:var(--amber);font-style:italic;font-size:.85em;margin:4px 0 12px}#notes .nl{margin:0 0 10px}
</style>
</head>
<body>
<header><i id="dot"></i><span id="stat">Connecting&#8230;</span><button id="reset">Reset</button><button id="timer" aria-label="Start or pause the timer">00:00</button></header>
<section id="now"><p class="kick">Slide <span id="num">1</span> / <span id="tot">1</span></p><h1 id="title"></h1><p id="nxt"></p></section>
<article id="notes" aria-live="polite"></article>
<div id="tools"><button id="aminus" aria-label="Smaller text">A&#8722;</button><button id="aplus" aria-label="Bigger text">A+</button><button id="listBtn">All slides</button></div>
<footer><button id="prevBtn">&#8249; Back</button><button id="nextBtn">Next &#8250;</button></footer>
<div id="list" hidden><button id="closeList">Close</button><h2>Go to slide</h2><ol id="ol"></ol></div>
<div id="join" hidden><h2>Connect to the slides</h2><p>On the laptop, press <b>P</b> or click <b>Phone</b> to see the code. Then type it here.</p><form id="jf"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE"><button type="submit">Connect</button></form></div>
<script>const TITLES=["Building Safer Homes, Together", "The professor's three comments. My three answers.", "Every line has a leader. The safe flat has none.", "Don't fight the leaders. Start where they aren't.", "Who buys it. Who picks it.", "Pricing", "From factory to home", "One promise: the safe home inside", "One campaign. Four lines.", "Honyar sells a safe flat, not parts.", "Partner first. Then build.", "Risks. And Honyar's answers.", "Let's build them safer, together"];const NOTES=["Hi everyone, I'm Can.\n• Last time, I showed you the problems in Turkish homes.\n• Today, I'll show you the marketing plan: how Honyar sells all four lines in Turkey.\n(CLICK · video)", "After the mid-term, the professor asked me three questions. Here's what I found.\n• First: new homes were built after the quake. Is the problem solved? Only partly. Istanbul still waits for its quake, and about 1.5 million old homes are not renewed.\n• Second: do French brands sell earthquake-safe home products? No. Schneider and Legrand sell normal breakers and alarms. Nothing for an earthquake inside the flat.\n• Third: do big new buildings need these systems? Yes, but the law already covers the towers. Normal flats get almost nothing. That's the gap.", "Now, the competition. Every product line already has a strong leader.\n• Switches: the market is too competitive.\n• Breakers: Schneider and ABB are very strong.\n• Lighting: a price fight with China.\n• Pipes: local brands like Fırat and Kalde.\n• Smart home: Xiaomi is a partner, not a rival.\n• So Honyar can't win line by line. But nobody sells one safety kit for one flat. That's Honyar's place.", "So how can Honyar win? I used three ideas from the course.\n• First, niche first mover. Don't fight the leaders in switches. Lead the normal flat, where the law asks for little.\n• Second, good enough for emerging markets. One simple kit, at a price families can pay.\n• Third, disruptive entry, like Nintendo's Wii. Simpler and cheaper. Start with normal flats, then move up to bigger buildings.\n• So Honyar is a follower in switches, but a leader in this niche.", "So who buys the kit, and who picks the brand? Four people decide.\n• The developer sets the rules.\n• The builder picks the brand, mostly on price.\n• The engineer approves it, and the electrician fits it.\n• So Honyar should sell to builders first, then electricians, then hotels.\n• In my mid-term, I put TOKİ first. But the builder picks the brand, not TOKİ. So TOKİ comes later.", "Now, price. My idea: Honyar should be cheaper than Schneider, safer than Viko.\n• Same breaker in the shop: Viko about 1,060 lira, Schneider about 1,350. Honyar, about 1,100.\n• The full kit is 15 percent cheaper than buying the parts one by one.\n• Prices in Turkey go up about 30 percent a year, so Honyar should price in euros.\n• Honyar's price is my plan. The others are real shop prices.", "Honyar asked me two questions about shops.\n• First: do shops pay only after they sell? Not usually. They buy on credit and pay in two to three months. But Honyar is new, so Honyar should give free trial stock to a few dealers.\n• Second: how much do they add? Wholesalers about 20 percent, shops about 30.\n• There aren't many public numbers, so Honyar should check them with dealers in Istanbul.", "Now, the brand. One promise: the safe home inside.\n• Families need trust, so a five-year warranty.\n• Distributors need it easy to sell, so free trial stock.\n• Builders need proof, so three test projects.\n• Engineers need papers, so CE and TSE files.\n• Honyar's target for the first year: 50 dealers and 5,000 flats.", "How do people hear about it? One campaign for all four lines.\n• First three months: launch, with a stand at Istanbul's big electrical fair.\n• Next three months: prove it, with short fire and leak test videos, shared by electricians.\n• Then grow: an earthquake drill day with schools, near the 6 February anniversary.\n• Every message shows the whole kit, so all four lines grow together.", "How does Honyar make money? From class, a business model has four parts.\n• Value: a safe flat, at one price.\n• Resources: four product lines, forty years, and Xiaomi's app.\n• Processes: train electricians, sell to builders, build locally.\n• Earnings: a price per flat, plus shop sales.\n• And partners fill what Honyar doesn't have. That's open innovation.", "So how does Honyar enter? Partner first, then build.\n• Year one: export, and sell with a Turkish partner. In my mid-term I said the import tax was high. I checked again: switches pay almost none. So exporting works.\n• Year two: a joint venture with a Turkish factory, using more than half local parts. That gives Honyar an edge in public tenders.\n• Year three: TOKİ's public homes, and then Europe.\n• It's like Tesla in Shanghai: build locally, and win the government's support.", "Of course, there are risks.\n• The lira moves fast, so Honyar should price in euros.\n• Viko could copy Honyar, so Honyar has to move first.\n• Electricians like old brands, so Honyar should give training and a good reward.\n• And families don't buy safety on their own. Even earthquake insurance covers only about half of homes. So Honyar sells safety inside the price of the home.", "So, to finish.\n• Turkey made the walls strong. Honyar can make the home safe.\n• Let's build them safer, together.\n• Thank you. I'm happy to take your questions."];</script>
<script src="vendor/mqtt.min.js"></script><script src="vendor/ntfy-link.js"></script>
<script>
(function(){
  var N=TITLES.length, cur=0, lastState=0, links=[], room=(location.hash||'').replace('#','').toUpperCase();
  var $=function(id){return document.getElementById(id);};
  // broker-cn.emqx.io is inside mainland China (fast without a VPN); the other two are backups.
  var BROKERS=['wss://broker-cn.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
  var lastTap=0;
  var nf=21; try{nf=parseInt(localStorage.getItem('honyarNf'),10)||21;}catch(e){}
  function setNf(v){nf=Math.max(15,Math.min(34,v));document.documentElement.style.setProperty('--nf',nf+'px');try{localStorage.setItem('honyarNf',nf);}catch(e){}}
  setNf(nf);
  $('tot').textContent=N;

  function render(){
    $('num').textContent=cur+1;
    $('title').textContent=TITLES[cur];
    $('nxt').textContent=cur<N-1?'Next: '+TITLES[cur+1]:'Last slide';
    var nb=$('notes'); nb.textContent='';(NOTES[cur]||'').split('\n').forEach(function(l){var p=document.createElement('p');var t=l.trim(); p.className=t.charAt(0)==='"'?'nl-open':t.charAt(0)==='('?'nl-cue':t.charAt(0)==='\u2022'?'nl-pt':'nl';p.textContent=t.charAt(0)==='\u2022'?t.slice(1).trim():t; nb.appendChild(p);});
    $('notes').scrollTop=0;
    var bs=$('ol').querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('cur',i===cur);
  }
  TITLES.forEach(function(t,i){var li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span>'+(i+1)+'</span>';b.appendChild(document.createTextNode(t));b.onclick=function(){go(i);$('list').hidden=true;};li.appendChild(b);$('ol').appendChild(li);});
  render();

  function setStatus(){
    var up=links.filter(function(c){return c.connected;}).length, live=Date.now()-lastState<40000;
    $('dot').className=live?'ok':up?'wait':'off';
    $('stat').textContent=!room?'Not connected':live?'Connected to the slides':up?'Waiting for the laptop ('+room+')':'Offline: notes only';
  }
  function send(a,n){
    var msg=JSON.stringify({a:a,n:n,id:Math.random().toString(36).slice(2)+Date.now()});
    links.forEach(function(c){if(c.connected)c.publish('honyar-final/v1/'+room+'/cmd',msg);});
  }
  function buzz(){try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}}
  // Always send the exact slide number, so fast taps can never skip or double up.
  function go(i){i=Math.max(0,Math.min(N-1,i));cur=i;lastTap=Date.now();render();send('go',i);buzz();startTimer();}
  $('nextBtn').onclick=function(){go(cur+1);};
  $('prevBtn').onclick=function(){cur>0?go(cur-1):buzz();};
  $('aplus').onclick=function(){setNf(nf+2);};
  $('aminus').onclick=function(){setNf(nf-2);};
  $('listBtn').onclick=function(){$('list').hidden=false;var c=$('ol').querySelector('.cur');if(c)c.scrollIntoView({block:'center'});};
  $('closeList').onclick=function(){$('list').hidden=true;};

  // Timer: tap to start or pause; it also starts on the first Next.
  var t0=0, acc=0, running=false;
  function startTimer(){if(!running){running=true;t0=Date.now();$('timer').classList.add('run');}}
  $('timer').onclick=function(){if(running){acc+=Date.now()-t0;running=false;$('timer').classList.remove('run');}else startTimer();};
  $('reset').onclick=function(){acc=0;t0=Date.now();running=false;$('timer').classList.remove('run');tick();};
  function tick(){var s=Math.floor((acc+(running?Date.now()-t0:0))/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  setInterval(tick,500);

  // Keep the phone screen on while presenting.
  var lock=null;
  function wakeLock(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){});}catch(e){}}
  document.addEventListener('click',wakeLock);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wakeLock();});

  function connect(){
    if(!window.mqtt){setStatus();return;}
    function wire(c){
        c.on('connect',function(){c.subscribe('honyar-final/v1/'+room+'/state');send('hello');setStatus();});
        c.on('close',setStatus);c.on('error',function(){});
        c.on('message',function(t,p){try{var m=JSON.parse(p.toString());if(typeof m.n==='number'&&m.t>=lastState){lastState=m.t;if(Date.now()-m.t<40000&&m.n!==cur&&Date.now()-lastTap>3000){cur=m.n;render();}}}catch(e){}setStatus();});
        links.push(c);
    }
    BROKERS.forEach(function(url){
      try{
        wire(mqtt.connect(url,{clientId:'phone_'+Math.random().toString(16).slice(2,10),reconnectPeriod:3000,connectTimeout:8000,keepalive:30}));
      }catch(e){}
    });
    // Fourth route on the normal HTTPS port, for networks that block the MQTT ports.
    if(window.ntfyConnect&&!window.HONYAR_LOCAL){try{wire(ntfyConnect());}catch(e){}}
    setInterval(function(){send('ping');setStatus();},15000);
  }
  if(/^[A-Z0-9]{6}$/.test(room)) connect(); else $('join').hidden=false;
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  $('jf').onsubmit=function(e){e.preventDefault();var v=$('code').value.trim().toUpperCase();if(/^[A-Z0-9]{6}$/.test(v)){room=v;history.replaceState(null,'','#'+v);$('join').hidden=true;connect();}};
  setStatus();
})();
</script>
</body>
</html>
